name: mcp-app-check
description: Static readiness and security checks for MCP Apps projects
author: Uky0Yang

branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Explicit trusted JSON policy path
    default: ""
  path:
    description: MCP Apps project directory to scan
    required: false
    default: .
  fail-on:
    description: Minimum severity that fails the workflow (none, warning, or error)
    required: false
    default: error
  format:
    description: Report format (text, json, or sarif)
    required: false
    default: text
  output:
    description: Optional report output file
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install mcp-app-check
      shell: bash
      env:
        MCP_APP_CHECK_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$MCP_APP_CHECK_ACTION_PATH"
    - name: Check MCP App
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        args=("$INPUT_PATH" "--fail-on" "$INPUT_FAIL_ON" "--format" "$INPUT_FORMAT")
        if [[ -n "$INPUT_CONFIG" ]]; then args+=(--config "$INPUT_CONFIG"); fi
        if [[ -n "$INPUT_OUTPUT" ]]; then
          args+=("--output" "$INPUT_OUTPUT")
        fi
        python -m mcp_app_check "${args[@]}"
