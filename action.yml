name: mcp-app-check
description: Static readiness and security checks for MCP Apps projects
author: Uky0Yang

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: MCP Apps project directory to scan
    required: false
    default: .
  fail-on:
    description: Minimum severity that fails the workflow (none, warning, or error)
    required: false
    default: error
  format:
    description: Report format (text or json)
    required: false
    default: text

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install mcp-app-check
      shell: bash
      env:
        MCP_APP_CHECK_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$MCP_APP_CHECK_ACTION_PATH"
    - name: Check MCP App
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: python -m mcp_app_check "$INPUT_PATH" --fail-on "$INPUT_FAIL_ON" --format "$INPUT_FORMAT"
