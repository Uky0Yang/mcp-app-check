name: Feature request
description: 建议新的检查规则或输出能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明真实使用场景和当前不足。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 规范或证据
      description: 如果是规则建议，请链接官方规范并给出最小正例和反例。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
